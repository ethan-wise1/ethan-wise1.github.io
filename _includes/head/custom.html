<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/iphone.css?v=1">

<script>
document.addEventListener("DOMContentLoaded", function() {
  if (window.innerWidth <= 430) { // iPhone width

    // ---- Author button: Follow → Contact Me ----
    const authorBtn = document.querySelector(".author__urls-wrapper .btn.open");
    if(authorBtn) {
      authorBtn.textContent = "Contact Me";
    }

    // ---- Hamburger menu top-right ----
    const toggle = document.querySelector(".greedy-nav__toggle");
    const mastheadInner = document.querySelector(".masthead__inner");
    if(toggle && mastheadInner) {
      // Keep it inside masthead__inner for proper JS behavior
      toggle.style.position = "absolute";
      toggle.style.top = "10px";
      toggle.style.right = "10px";
      toggle.style.margin = "0";
      toggle.style.zIndex = "999";
    }

  }
});
</script>
