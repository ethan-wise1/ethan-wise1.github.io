<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/iphone.css?v=1">

<style>
/* Author icons colors for all devices */
.author__urls li a i.fab.fa-linkedin {
    color: #0077B5; /* LinkedIn blue */
}

.author__urls li a i.fas.fa-file-alt {
    color: #d44638; /* Resume red */
}

.author__urls li a i.fas.fa-envelope {
    color: #ff6f00; /* Gmail orange */
}

/* Optional hover effect */
.author__urls li a:hover i {
    opacity: 0.8;
}
</style>

<script>
function updateAuthorButton() {
    const authorBtn = document.querySelector(".author__urls-wrapper .btn.btn--inverse.open");
    if(authorBtn) {
        // Update the text immediately
        authorBtn.textContent = "Contact Me";

        // Ensure it stays updated when clicked (because theme may toggle it)
        authorBtn.addEventListener("click", () => {
            setTimeout(() => {
                authorBtn.textContent = "Contact Me";
            }, 10); // small delay to let theme JS run first
        });
        return true; // success
    }
    return false; // button not yet in DOM
}

// Poll until the button exists
const intervalId = setInterval(() => {
    if(updateAuthorButton()) {
        clearInterval(intervalId); // stop polling once button is updated
    }
}, 50);
</script>
