<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/iphone.css?v=1">

<style>
/* Author icons colors for all devices */
.author__urls li a i.fab.fa-linkedin {
    color: #0077B5; /* LinkedIn blue */
}

.author__urls li a i.fas.fa-file-alt {
    color: #d44638; /* Resume red */
}

.author__urls li a i.fas.fa-envelope {
    color: #ff6f00; /* Gmail orange */
}

/* Optional hover effect */
.author__urls li a:hover i {
    opacity: 0.8;
}

    
<script>
document.addEventListener("DOMContentLoaded", function() {
  const interval = setInterval(() => {
    const authorBtn = document.querySelector(".author__urls-wrapper .btn.open");
    if (authorBtn) {
      authorBtn.textContent = "Contact Me"; // Replace “Follow” immediately
      clearInterval(interval);              // Stop polling once done
    }
  }, 50); // Check every 50ms for fast replacement
});
</script>
