<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/iphone.css?v=1">

<style>
/* Author icons colors for all devices */
.author__urls li a i.fab.fa-linkedin {
    color: #0077B5; /* LinkedIn blue */
}

.author__urls li a i.fas.fa-file-alt {
    color: #d44638; /* Resume red */
}

.author__urls li a i.fas.fa-envelope {
    color: #ff6f00; /* Gmail orange */
}

/* Optional hover effect */
.author__urls li a:hover i {
    opacity: 0.8;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Target the parent wrapper that contains the author button
    const wrapper = document.querySelector(".author__urls-wrapper");
    if (!wrapper) return;

    // Create a MutationObserver to watch for changes in the wrapper
    const observer = new MutationObserver(() => {
        const authorBtn = wrapper.querySelector(".btn.btn--inverse.open");
        if (authorBtn && authorBtn.textContent !== "Contact Me") {
            authorBtn.textContent = "Contact Me";
        }
    });

    // Observe child changes (the button is usually added dynamically)
    observer.observe(wrapper, { childList: true, subtree: true });

    // Optionally, do an immediate check in case the button already exists
    const authorBtn = wrapper.querySelector(".btn.btn--inverse.open");
    if (authorBtn) authorBtn.textContent = "Contact Me";
});
</script>
