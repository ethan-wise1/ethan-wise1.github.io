<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/iphone.css?v=1">

<script>
if (window.innerWidth <= 430) { // iPhone width
  function updateAuthorButton() {
    const authorBtn = document.querySelector(".author__urls-wrapper .btn.open");
    if (authorBtn) {
      authorBtn.textContent = "Contact Me";
    } else {
      // Retry in 100ms until button exists
      setTimeout(updateAuthorButton, 100);
    }
  }
  updateAuthorButton();
}
</script>
